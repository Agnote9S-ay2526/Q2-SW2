<h2>School Office Hours</h2>

<table>
    <thead>
        <tr>
         <th>Day</th>
         <th>Office Hours</th>
         <th>Department</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Monday</td>
            <td>8:00am-4:00pm</td>
            <td>Registrar's Office</td>
        </tr>

         <tr>
            <td>Tuesday</td>
            <td>8:00am-4:00pm</td>
            <td>Accounting Office</td>
        </tr>

         <tr>
            <td>Wednesday</td>
            <td>8:00am-4:00pm</td>
            <td>Guidance Office</td>
        </tr>

         <tr>
            <td>Thursday</td>
            <td>8:00am-4:00pm</td>
            <td>Principal's Office</td>
        </tr>

         <tr>
            <td>Friday</td>
            <td>8:00am-3:00pm</td>
            <td>Admin Office</td>
        </tr>
    </tbody>
</table>

<div class="horizontal-layout bg-light p-3 mb-3 rounded">
    <h2>Contact Us</h2>
    <form>

          <!-- FULL NAME -->
         <div class="row mb-3">
            <label for="inputFname" class="col-sm-2 col-form-label">Full Name</label>
             <div class="col-sm-10">
                 <input type="fname" class="form-control" id="inputFname" placeholder="Full Name">
            </div>
        </div>
        
        <!-- EMAIL -->
         <div class="row mb-3">
            <label for="inputEmail" class="col-sm-2 col-form-label">Email</label>
             <div class="col-sm-10">
                 <input type="email" class="form-control" id="inputEmail" placeholder="Email">
            </div>
        </div>
        <!-- SUBJECT -->
        <div class="row mb-3">
            <label for="inputsubj" class="col-sm-2 col-form-label">Subject</label>
            <div class="col-sm-10">
              <input type="subj" class="form-control" id="inputsubj" placeholder="Subject">
             </div>
        </div>


        <!-- MESSAGE -->
        <div class="row mb-3">
            <label for="inputmsg" class="col-sm-2 col-form-label">Message</label>
            <div class="col-sm-10">
              <input type="msg" class="form-control" id="inputmsg" placeholder="Type your message here..">
             </div>
        </div>

        <!-- CHECKBOX-->
         <div class="col-auto">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="checkRemember">
                <label class="form-check-label" for="checkRemember">Remember me</label>
            </div>
        </div>

        <!-- BUTTON-->
        <div class="col-auto">
            <button type="submit" class="btn btn-danger">Sign in</button>
        </div>
        

    </form>
</div>

    <footer class="text-center py-3 bg-dark text-light mt-auto fixed-bottom">

    </footer>
